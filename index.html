<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Website Dashboard</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f2f5f7;
}

header{
    background:#0d6efd;
    color:white;
    padding:15px;
    text-align:center;
    font-size:28px;
    font-weight:bold;
}

.container{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    padding:30px;
}

.card{
    background:white;
    border-radius:10px;
    box-shadow:0 4px 10px rgba(0,0,0,.2);
    padding:20px;
    text-align:center;
}

.card h3{
    color:#333;
}

button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:5px;
    background:#0d6efd;
    color:white;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#084298;
}
</style>

</head>
<body>

<header>
Website Dashboard
</header>

<div class="container">

<div class="card">
<h3>Income Tax Portal</h3>
<button onclick="window.open('https://www.incometax.gov.in','_blank')">
Open Website
</button>
</div>

<div class="card">
<h3>GST Portal</h3>
<button onclick="window.open('https://www.gst.gov.in','_blank')">
Open Website
</button>
</div>

<div class="card">
<h3>MCA Portal</h3>
<button onclick="window.open('https://www.mca.gov.in','_blank')">
Open Website
</button>
</div>

<div class="card">
<h3>TRACES</h3>
<button onclick="window.open('https://contents.tdscpc.gov.in','_blank')">
Open Website
</button>
</div>

<div class="card">
<h3>EPFO</h3>
<button onclick="window.open('https://www.epfindia.gov.in','_blank')">
Open Website
</button>
</div>

<div class="card">
<h3>ESIC</h3>
<button onclick="window.open('https://www.esic.gov.in','_blank')">
Open Website
</button>
</div>

<div class="card">
<h3>Google</h3>
<button onclick="window.open('https://www.google.com','_blank')">
Open Website
</button>
</div>

<div class="card">
<h3>YouTube</h3>
<button onclick="window.open('https://www.youtube.com','_blank')">
Open Website
</button>
</div>

<div class="card">

</div>

<div class="card">
<h3>Canara Bank</h3>
<button onclick="window.open('https://canarabank.com','_blank')">
Open Website
</button>
</div>

<div class="card">
<h3>Union Bank</h3>
<button onclick="window.open('https://www.unionbankofindia.co.in','_blank')">
Open Website
</button>
</div>

</div>

</body>
</html>
